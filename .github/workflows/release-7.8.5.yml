name: One-time publishing fork 7.8.5 release

on:
  push:
    branches: [codex/publish-center]
    paths: [.github/workflows/release-7.8.5.yml]

permissions: {}
concurrency:
  group: publishing-fork-release-7.8.5
  cancel-in-progress: false

env:
  SOURCE_SHA: 2d70ea3349d6b25a71193669394df1c9a7a6fb49
  RELEASE_TAG: 7.8.5
  RELEASE_REPO: Ravenbaar/obsidian-enveloppe

jobs:
  build:
    if: >-
      github.repository == 'Ravenbaar/obsidian-enveloppe' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/publish-center' &&
      github.event.before == '8f5b8c863e7d0e276922cea6bf7130a7d7c0e73c'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      main_sha: ${{ steps.integrity.outputs.main_sha }}
      manifest_sha: ${{ steps.integrity.outputs.manifest_sha }}
      styles_sha: ${{ steps.integrity.outputs.styles_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2d70ea3349d6b25a71193669394df1c9a7a6fb49
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify immutable source and release version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C src/i18n/locales rev-parse HEAD)" = a5fc724cebbbc90523f387093ee8ae835fdada25
          node -e 'const a=require("./manifest.json"),p=require("./package.json");if(a.id!=="obsidian-mkdocs-publisher"||a.version!=="7.8.5"||p.version!=="7.8.5"||a.minAppVersion!=="1.11.14")process.exit(1)'
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --noEmit --skipLibCheck
      - run: pnpm run test:publication
      - run: node esbuild.config.mjs --production
      - name: Verify exactly three build assets
        id: integrity
        run: |
          set -euo pipefail
          test "$(find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort | paste -sd, -)" = 'main.js,manifest.json,styles.css'
          test "$(find dist -mindepth 1 | wc -l)" -eq 3
          cmp manifest.json dist/manifest.json
          for file in main.js manifest.json styles.css; do test -s "dist/$file"; done
          echo "main_sha=$(sha256sum dist/main.js | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "manifest_sha=$(sha256sum dist/manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "styles_sha=$(sha256sum dist/styles.css | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          sha256sum dist/main.js dist/manifest.json dist/styles.css
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: enveloppe-7.8.5-release
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: >-
      github.repository == 'Ravenbaar/obsidian-enveloppe' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/publish-center' &&
      github.event.before == '8f5b8c863e7d0e276922cea6bf7130a7d7c0e73c'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_MAIN: ${{ needs.build.outputs.main_sha }}
      EXPECTED_MANIFEST: ${{ needs.build.outputs.manifest_sha }}
      EXPECTED_STYLES: ${{ needs.build.outputs.styles_sha }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify artifact identity and bytes
        run: |
          set -euo pipefail
          test "$(find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort | paste -sd, -)" = 'main.js,manifest.json,styles.css'
          test "$(find dist -mindepth 1 | wc -l)" -eq 3
          printf '%s  %s\n' "$EXPECTED_MAIN" dist/main.js "$EXPECTED_MANIFEST" dist/manifest.json "$EXPECTED_STYLES" dist/styles.css | sha256sum --check --strict
          node -e 'const a=require("./dist/manifest.json");if(a.id!=="obsidian-mkdocs-publisher"||a.version!=="7.8.5"||a.minAppVersion!=="1.11.14")process.exit(1)'
      - name: Verify and publish the inspected draft by immutable release ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$RELEASE_REPO/git/ref/heads/codex/publish-center" --jq .object.sha)" = "$GITHUB_SHA"
          if gh api "repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG" > existing.json 2> lookup.err; then
            echo 'Refusing an existing 7.8.5 tag' >&2
            exit 1
          elif ! grep -Fq '(HTTP 404)' lookup.err; then
            cat lookup.err >&2
            exit 1
          fi
          gh api "repos/$RELEASE_REPO/releases/414483079" > release.json
          node <<'CHECK'
          const r=require('./release.json');
          const expected=[['main.js',645922912,process.env.EXPECTED_MAIN],['manifest.json',645922908,process.env.EXPECTED_MANIFEST],['styles.css',645922910,process.env.EXPECTED_STYLES]];
          if(r.id!==414483079||!r.draft||r.prerelease||r.tag_name!=='7.8.5'||r.target_commitish!==process.env.SOURCE_SHA||r.assets.length!==3)process.exit(1);
          for(const [name,id,digest] of expected){const a=r.assets.find(a=>a.name===name);if(!a||a.id!==id||a.state!=='uploaded'||a.digest!=='sha256:'+digest)process.exit(1);}
          CHECK
          mkdir verified
          gh api -H 'Accept: application/octet-stream' "repos/$RELEASE_REPO/releases/assets/645922912" > verified/main.js
          gh api -H 'Accept: application/octet-stream' "repos/$RELEASE_REPO/releases/assets/645922908" > verified/manifest.json
          gh api -H 'Accept: application/octet-stream' "repos/$RELEASE_REPO/releases/assets/645922910" > verified/styles.css
          printf '%s  %s\n' "$EXPECTED_MAIN" verified/main.js "$EXPECTED_MANIFEST" verified/manifest.json "$EXPECTED_STYLES" verified/styles.css | sha256sum --check --strict
          node -e 'const a=require("./verified/manifest.json");if(a.id!=="obsidian-mkdocs-publisher"||a.version!=="7.8.5"||a.minAppVersion!=="1.11.14")process.exit(1)'
          test "$(gh api "repos/$RELEASE_REPO/git/ref/heads/codex/publish-center" --jq .object.sha)" = "$GITHUB_SHA"
          gh api --method PATCH "repos/$RELEASE_REPO/releases/414483079" -F draft=false -f make_latest=true > published.json
          test "$(gh api "repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          node -e 'const r=require("./published.json");if(r.id!==414483079||r.draft||r.prerelease||r.tag_name!=="7.8.5"||r.target_commitish!==process.env.SOURCE_SHA||r.assets.length!==3)process.exit(1);console.log(r.html_url)'
          echo "Published 7.8.5 from $SOURCE_SHA; remove this temporary workflow after verification." >> "$GITHUB_STEP_SUMMARY"
