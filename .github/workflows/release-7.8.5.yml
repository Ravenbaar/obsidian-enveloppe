name: One-time publishing fork 7.8.5 release

on:
  push:
    branches: [codex/publish-center]
    paths: [.github/workflows/release-7.8.5.yml]

permissions: {}
concurrency:
  group: publishing-fork-release-7.8.5
  cancel-in-progress: false

env:
  SOURCE_SHA: 2d70ea3349d6b25a71193669394df1c9a7a6fb49
  RELEASE_TAG: 7.8.5
  RELEASE_REPO: Ravenbaar/obsidian-enveloppe

jobs:
  build:
    if: >-
      github.repository == 'Ravenbaar/obsidian-enveloppe' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/publish-center' &&
      github.event.before == '2d70ea3349d6b25a71193669394df1c9a7a6fb49'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      main_sha: ${{ steps.integrity.outputs.main_sha }}
      manifest_sha: ${{ steps.integrity.outputs.manifest_sha }}
      styles_sha: ${{ steps.integrity.outputs.styles_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2d70ea3349d6b25a71193669394df1c9a7a6fb49
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify immutable source and release version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C src/i18n/locales rev-parse HEAD)" = a5fc724cebbbc90523f387093ee8ae835fdada25
          node -e 'const a=require("./manifest.json"),p=require("./package.json");if(a.id!=="obsidian-mkdocs-publisher"||a.version!=="7.8.5"||p.version!=="7.8.5"||a.minAppVersion!=="1.11.14")process.exit(1)'
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --noEmit --skipLibCheck
      - run: pnpm run test:publication
      - run: node esbuild.config.mjs --production
      - name: Verify exactly three build assets
        id: integrity
        run: |
          set -euo pipefail
          test "$(find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort | paste -sd, -)" = 'main.js,manifest.json,styles.css'
          test "$(find dist -mindepth 1 | wc -l)" -eq 3
          cmp manifest.json dist/manifest.json
          for file in main.js manifest.json styles.css; do test -s "dist/$file"; done
          echo "main_sha=$(sha256sum dist/main.js | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "manifest_sha=$(sha256sum dist/manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "styles_sha=$(sha256sum dist/styles.css | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          sha256sum dist/main.js dist/manifest.json dist/styles.css
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: enveloppe-7.8.5-release
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: >-
      github.repository == 'Ravenbaar/obsidian-enveloppe' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/publish-center' &&
      github.event.before == '2d70ea3349d6b25a71193669394df1c9a7a6fb49'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_MAIN: ${{ needs.build.outputs.main_sha }}
      EXPECTED_MANIFEST: ${{ needs.build.outputs.manifest_sha }}
      EXPECTED_STYLES: ${{ needs.build.outputs.styles_sha }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify artifact identity and bytes
        run: |
          set -euo pipefail
          test "$(find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort | paste -sd, -)" = 'main.js,manifest.json,styles.css'
          test "$(find dist -mindepth 1 | wc -l)" -eq 3
          printf '%s  %s\n' "$EXPECTED_MAIN" dist/main.js "$EXPECTED_MANIFEST" dist/manifest.json "$EXPECTED_STYLES" dist/styles.css | sha256sum --check --strict
          node -e 'const a=require("./dist/manifest.json");if(a.id!=="obsidian-mkdocs-publisher"||a.version!=="7.8.5"||a.minAppVersion!=="1.11.14")process.exit(1)'
      - name: Create draft, verify three uploaded assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$RELEASE_REPO/git/ref/heads/codex/publish-center" --jq .object.sha)" = "$GITHUB_SHA"
          for endpoint in "git/ref/tags/$RELEASE_TAG" "releases/tags/$RELEASE_TAG"; do
            if gh api "repos/$RELEASE_REPO/$endpoint" > existing.json 2> lookup.err; then
              echo "Refusing to replace existing tag or release: $endpoint" >&2
              exit 1
            elif ! grep -Fq '(HTTP 404)' lookup.err; then
              cat lookup.err >&2
              exit 1
            fi
          done
          cat > RELEASE.md <<'NOTES'
          ## Enveloppe 发布中心 7.8.5

          - 支持原生 Obsidian 双链、别名和标题链接；未发布目标保留原写法，配套网站以后可自动关联。
          - 增加中文加密发布前检查，按原稿行号提示错误；保留代码示例、表格和文本脱敏配置。
          - 保留插件 ID、已有设置和 SecretStorage。需要 Obsidian 1.11.14 或更新版本，以及支持原生双链的配套网站。

          安装：关闭插件，备份旧程序文件，只替换 main.js、manifest.json、styles.css，再启用。保留 data.json 和钥匙串；不要删除整个插件目录。BRAT 1.1.0+ 可固定本仓库的 7.8.5 标签。官方更新可能覆盖定制功能。

          验证：类型检查、52 项发布行为测试、生产构建及发行附件 SHA-256 回读核验。此版本未重新进行真实 Obsidian 安装与移动端验收。

          源码：2d70ea3349d6b25a71193669394df1c9a7a6fb49（codex/publish-center）。
          NOTES
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --target "$SOURCE_SHA" --title "$RELEASE_TAG" --draft --notes-file RELEASE.md dist/main.js dist/manifest.json dist/styles.css
          gh api "repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG" > release.json
          node -e 'const r=require("./release.json");if(!r.draft||r.target_commitish!==process.env.SOURCE_SHA||r.assets.map(a=>a.name).sort().join(",")!=="main.js,manifest.json,styles.css"||r.assets.some(a=>a.state!=="uploaded"))process.exit(1)'
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" --dir verified --pattern '*'
          printf '%s  %s\n' "$EXPECTED_MAIN" verified/main.js "$EXPECTED_MANIFEST" verified/manifest.json "$EXPECTED_STYLES" verified/styles.css | sha256sum --check --strict
          test "$(gh api "repos/$RELEASE_REPO/git/ref/heads/codex/publish-center" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false --latest
          test "$(gh api "repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          gh api "repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG" > published.json
          node -e 'const r=require("./published.json");if(r.draft||r.prerelease||r.tag_name!=="7.8.5"||r.assets.length!==3)process.exit(1); console.log(r.html_url)'
          echo "Published 7.8.5 from $SOURCE_SHA; remove this temporary workflow after verification." >> "$GITHUB_STEP_SUMMARY"
